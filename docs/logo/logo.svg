<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="240" height="240" role="img" aria-label="Agentic Git Sync">
  <defs>
    <linearGradient id="gem-body" x1="20" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#5B3FE0"/>
    </linearGradient>
    <linearGradient id="gem-top-facet" x1="50" y1="8" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gem-left-facet" x1="0" y1="50" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="seam-gold" x1="50" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="seam-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Hexagonal gem body -->
  <path d="M 50 8 L 88 30 L 88 70 L 50 92 L 12 70 L 12 30 Z" fill="url(#gem-body)"/>

  <!-- Top facet (subtle highlight on upper half) -->
  <path d="M 50 8 L 88 30 L 50 50 L 12 30 Z" fill="url(#gem-top-facet)"/>

  <!-- Left facet (slightly lighter to suggest 3D form) -->
  <path d="M 12 30 L 50 50 L 50 92 L 12 70 Z" fill="url(#gem-left-facet)"/>

  <!-- Subtle facet edge lines for crystalline structure -->
  <path d="M 50 8 L 50 50 L 88 70 M 50 50 L 12 70"
        stroke="#000" stroke-opacity="0.08" stroke-width="0.5" fill="none"/>

  <!-- Kintsugi gold seam — jagged crack mended with gold, runs through the gem -->
  <!-- First a blurred glow underneath -->
  <path d="M 36 16 L 48 32 L 40 42 L 56 54 L 44 64 L 58 80 L 52 88"
        fill="none" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.45" filter="url(#seam-glow)"/>
  <!-- Then the crisp gold line on top -->
  <path d="M 36 16 L 48 32 L 40 42 L 56 54 L 44 64 L 58 80 L 52 88"
        fill="none" stroke="url(#seam-gold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A tiny luminous dot at the seam's brightest bend (the AI "node") -->
  <circle cx="50" cy="48" r="2.5" fill="#FEF3C7"/>
  <circle cx="50" cy="48" r="1" fill="#FFFFFF"/>
</svg>
